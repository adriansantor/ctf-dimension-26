name: Sync Branches With Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync remote branches with main safely
        env:
          MAIN_BRANCH: main
          EXCLUDED_BRANCHES: main
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          main_sha="$(git rev-parse "origin/${MAIN_BRANCH}")"
          echo "Main SHA: ${main_sha}"

          mapfile -t remote_branches < <(
            git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin \
            | grep -Ev '^(HEAD)$'
          )

          IFS=',' read -r -a excluded_raw <<< "${EXCLUDED_BRANCHES}"
          excluded=()
          for item in "${excluded_raw[@]}"; do
            trimmed="$(echo "${item}" | xargs)"
            if [[ -n "${trimmed}" ]]; then
              excluded+=("${trimmed}")
            fi
          done

          is_excluded() {
            local branch="$1"
            for ex in "${excluded[@]}"; do
              if [[ "${branch}" == "${ex}" ]]; then
                return 0
              fi
            done
            return 1
          }

          for branch in "${remote_branches[@]}"; do
            if is_excluded "${branch}"; then
              echo "Skipping excluded branch: ${branch}"
              continue
            fi

            branch_ref="origin/${branch}"
            ahead_count="$(git rev-list --count "origin/${MAIN_BRANCH}..${branch_ref}")"
            behind_count="$(git rev-list --count "${branch_ref}..origin/${MAIN_BRANCH}")"

            echo "Branch ${branch}: ahead=${ahead_count}, behind=${behind_count}"

            if [[ "${ahead_count}" -eq 0 ]]; then
              if [[ "${behind_count}" -eq 0 ]]; then
                echo "${branch} is already up to date with ${MAIN_BRANCH}."
                continue
              fi

              echo "${branch} has no own commits; fast-forwarding to ${MAIN_BRANCH}."
              if git push origin "${main_sha}:refs/heads/${branch}"; then
                echo "Fast-forwarded ${branch}."
              else
                echo "Could not update ${branch} (possibly branch protection). Continuing..."
              fi
              continue
            fi

            echo "${branch} has own commits; attempting to merge ${MAIN_BRANCH} into ${branch}."
            git checkout -B "${branch}" "${branch_ref}"
            if git merge --no-ff --no-edit "origin/${MAIN_BRANCH}"; then
              if git push origin "HEAD:refs/heads/${branch}"; then
                echo "Merged ${MAIN_BRANCH} into ${branch} and pushed successfully."
              else
                echo "Merge succeeded but push failed for ${branch} (possibly branch protection)."
              fi
            else
              echo "Merge conflict while syncing ${branch}; keeping branch unchanged."
              git merge --abort || true
            fi
          done
